<svg xmlns="http://www.w3.org/2000/svg" width="760" height="998" viewBox="0 0 760 998" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="998" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">Two checks guard every answer: privacy before work, validation after</text>
<path d="M250 112 L250 136" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 192 L250 216" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 304 L250 328" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 384 L250 408" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 464 L250 488" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 576 L250 600" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 656 L250 680" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 736 L250 760" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M250 816 L250 840" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M360 260 L470 260" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M360 532 L470 532" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M710 260 L730 260 L730 628 L410 628" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M595 560 L595 628" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<g id="clean-the-input"><rect x="90" y="56" width="320" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="80" font-size="13" font-weight="600" fill="#1F2328">Clean the input</text>
<text x="398" y="80" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">input_guard</text>
<text x="106" y="96" font-size="11.5" fill="#5B6470">Strip control characters, cap the length</text>
</g>
<g id="classify-the-intent"><rect x="90" y="136" width="320" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="160" font-size="13" font-weight="600" fill="#1F2328">Classify the intent</text>
<text x="398" y="160" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">classify</text>
<text x="106" y="176" font-size="11.5" fill="#5B6470">Rules choose from 11 allowed intents</text>
</g>
<g id="privacy-gate"><polygon points="140,260 250,216 360,260 250,304" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/><text x="250" y="257" font-size="13" text-anchor="middle" fill="#1F2328">Passes privacy and</text><text x="250" y="274" font-size="13" text-anchor="middle" fill="#1F2328">injection checks?</text></g>
<g id="refuse--call-no-tool"><rect x="470" y="232" width="240" height="56" rx="8" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="486" y="256" font-size="13" font-weight="600" fill="#1F2328">Refuse, call no tool</text>
<text x="698" y="256" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">refuse</text>
<text x="486" y="272" font-size="11.5" fill="#5B6470">Answer type refused</text>
</g>
<g id="plan-the-route"><rect x="90" y="328" width="320" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="352" font-size="13" font-weight="600" fill="#1F2328">Plan the route</text>
<text x="398" y="352" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">plan</text>
<text x="106" y="368" font-size="11.5" fill="#5B6470">Each intent maps to allowed tools</text>
</g>
<g id="run-allowlisted-tools"><rect x="90" y="408" width="320" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="432" font-size="13" font-weight="600" fill="#1F2328">Run allowlisted tools</text>
<text x="398" y="432" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">execute_tools</text>
<text x="106" y="448" font-size="11.5" fill="#5B6470">Parameterised queries, exact arithmetic</text>
</g>
<g id="documents-gate"><polygon points="140,532 250,488 360,532 250,576" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/><text x="250" y="529" font-size="13" text-anchor="middle" fill="#1F2328">Document text</text><text x="250" y="546" font-size="13" text-anchor="middle" fill="#1F2328">needed?</text></g>
<g id="find-evidence"><rect x="470" y="504" width="240" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="486" y="528" font-size="13" font-weight="600" fill="#1F2328">Find evidence</text>
<text x="698" y="528" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">document_path</text>
<text x="486" y="544" font-size="11.5" fill="#5B6470">Retrieve, rank by authority</text>
</g>
<g id="compose-the-draft"><rect x="90" y="600" width="320" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="624" font-size="13" font-weight="600" fill="#1F2328">Compose the draft</text>
<text x="398" y="624" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">compose</text>
<text x="106" y="640" font-size="11.5" fill="#5B6470">Choose answer type, merge citations</text>
</g>
<g id="reword-the-draft"><rect x="90" y="680" width="320" height="56" rx="8" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="106" y="704" font-size="13" font-weight="600" fill="#1F2328">Reword the draft</text>
<text x="398" y="704" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">generate</text>
<text x="106" y="720" font-size="11.5" fill="#5B6470">Optional language model, skipped for refusals</text>
</g>
<g id="validate-the-final-text"><rect x="90" y="760" width="320" height="56" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="106" y="784" font-size="13" font-weight="600" fill="#1F2328">Validate the final text</text>
<text x="398" y="784" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">validate</text>
<text x="106" y="800" font-size="11.5" fill="#5B6470">Numbers, ids and verdict must match facts</text>
</g>
<g id="audit-and-respond"><rect x="90" y="840" width="320" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="106" y="864" font-size="13" font-weight="600" fill="#1F2328">Audit and respond</text>
<text x="398" y="864" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">finalize</text>
<text x="106" y="880" font-size="11.5" fill="#5B6470">Save the audit record, return the answer</text>
</g>
<text x="262" y="320" font-size="11.5" fill="#5B6470">yes</text>
<text x="415" y="252" font-size="11.5" text-anchor="middle" fill="#5B6470">no</text>
<text x="415" y="524" font-size="11.5" text-anchor="middle" fill="#5B6470">yes</text>
<text x="262" y="592" font-size="11.5" fill="#5B6470">no</text>
<text x="24" y="926" font-size="11.5" fill="#5B6470">A refusal still passes through compose, generate and validate; generate skips the language model for it.</text>
<rect x="24" y="948" width="16" height="12" rx="3" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="46" y="958" font-size="11.5" fill="#5B6470">Check</text>
<rect x="98.7625" y="948" width="16" height="12" rx="3" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="120.7625" y="958" font-size="11.5" fill="#5B6470">Language model</text>
<rect x="228.89749999999998" y="948" width="16" height="12" rx="3" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="250.89749999999998" y="958" font-size="11.5" fill="#5B6470">Runs only when needed</text>
<rect x="402.1" y="948" width="16" height="12" rx="3" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="424.1" y="958" font-size="11.5" fill="#5B6470">Refusal</text>
<rect x="489.1675" y="948" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="511.1675" y="958" font-size="11.5" fill="#5B6470">Data written</text>
</svg>
