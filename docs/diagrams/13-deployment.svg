<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="628" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">Planned deployment: three containers, three volumes, one start-up job</text>
<g id="browser"><rect x="24" y="56" width="224" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="40" y="80" font-size="13" font-weight="600" fill="#1F2328">Browser</text>
<text x="40" y="96" font-size="11.5" fill="#5B6470">Student or administrator</text>
</g>
<path d="M136 112 L136 152" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="streamlit-app"><rect x="24" y="152" width="224" height="72" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328">Streamlit app</text>
<text x="40" y="192" font-size="11.5" fill="#5B6470">Port 8501</text>
<text x="40" y="208" font-size="11.5" fill="#5B6470">Ask, upload, audit viewer</text>
</g>
<g id="fastapi-service"><rect x="268" y="152" width="224" height="72" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="284" y="176" font-size="13" font-weight="600" fill="#1F2328">FastAPI service</text>
<text x="284" y="192" font-size="11.5" fill="#5B6470">Port 8000</text>
<text x="284" y="208" font-size="11.5" fill="#5B6470">LangGraph, tools, retrieval</text>
</g>
<g id="ollama"><rect x="512" y="152" width="224" height="72" rx="8" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="528" y="176" font-size="13" font-weight="600" fill="#1F2328">Ollama</text>
<text x="528" y="192" font-size="11.5" fill="#5B6470">Port 11434</text>
<text x="528" y="208" font-size="11.5" fill="#5B6470">Local language model</text>
</g>
<path d="M248 196 L268 196" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M492 196 L512 196" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="258" y="188" font-size="11.5" text-anchor="middle" fill="#5B6470"></text>
<path d="M380 224 L380 288" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M336 224 L336 262 L136 262 L136 288" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M624 224 L624 288" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="chroma-volume"><rect x="24" y="288" width="224" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="40" y="312" font-size="13" font-weight="600" fill="#1F2328">Chroma volume</text>
<text x="40" y="328" font-size="11.5" fill="#5B6470">Chunk vectors</text>
</g>
<g id="data-volume"><rect x="268" y="288" width="224" height="72" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="284" y="312" font-size="13" font-weight="600" fill="#1F2328">Data volume</text>
<text x="284" y="328" font-size="11.5" fill="#5B6470">SQLite database and</text>
<text x="284" y="344" font-size="11.5" fill="#5B6470">original documents</text>
</g>
<g id="model-volume"><rect x="512" y="288" width="224" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="528" y="312" font-size="13" font-weight="600" fill="#1F2328">Model volume</text>
<text x="528" y="328" font-size="11.5" fill="#5B6470">Downloaded model files</text>
</g>
<g id="start-up-job"><rect x="268" y="408" width="224" height="88" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="284" y="432" font-size="13" font-weight="600" fill="#1F2328">Start-up job</text>
<text x="284" y="448" font-size="11.5" fill="#5B6470">Generate and validate data,</text>
<text x="284" y="464" font-size="11.5" fill="#5B6470">seed the database and index,</text>
<text x="284" y="480" font-size="11.5" fill="#5B6470">then start the service</text>
</g>
<path d="M380 408 L380 376" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M300 408 L300 392 L136 392 L136 344" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="environment-settings"><rect x="512" y="408" width="224" height="120" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="528" y="432" font-size="13" font-weight="600" fill="#1F2328">Environment settings</text>
<text x="528" y="448" font-size="11.5" fill="#5B6470">MOCK_LLM, LLM_MODEL,</text>
<text x="528" y="464" font-size="11.5" fill="#5B6470">OLLAMA_BASE_URL,</text>
<text x="528" y="480" font-size="11.5" fill="#5B6470">EMBEDDING_BACKEND,</text>
<text x="528" y="496" font-size="11.5" fill="#5B6470">SQLITE_PATH, CHROMA_PATH,</text>
<text x="528" y="512" font-size="11.5" fill="#5B6470">ADMIN_TOKEN, AUDIT_SALT</text>
</g>
<text x="24" y="556" font-size="11.5" fill="#5B6470">The compose file and Dockerfiles are not written yet; this is the design they will follow.</text>
<rect x="24" y="578" width="16" height="12" rx="3" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="46" y="588" font-size="11.5" fill="#5B6470">Our code</text>
<rect x="117.22" y="578" width="16" height="12" rx="3" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="139.22" y="588" font-size="11.5" fill="#5B6470">Language model</text>
<rect x="247.355" y="578" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="269.355" y="588" font-size="11.5" fill="#5B6470">Volume</text>
<rect x="328.27" y="578" width="16" height="12" rx="3" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="350.27" y="588" font-size="11.5" fill="#5B6470">Settings</text>
</svg>
