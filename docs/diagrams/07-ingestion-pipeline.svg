<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1026" viewBox="0 0 760 1026" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="1026" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">A new document is searchable the moment ingestion ends, with no restart</text>
<g id="upload-file-and-metadata"><rect x="80" y="56" width="340" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="80" font-size="13" font-weight="600" fill="#1F2328">Upload file and metadata</text>
<text x="96" y="96" font-size="11.5" fill="#5B6470">POST /ingest or the command line loader</text>
</g>
<path d="M250 112 L250 140" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="unchanged-gate"><polygon points="140,184 250,140 360,184 250,228" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/><text x="250" y="181" font-size="13" text-anchor="middle" fill="#1F2328">Same content and</text><text x="250" y="198" font-size="13" text-anchor="middle" fill="#1F2328">metadata stored?</text></g>
<path d="M360 184 L470 184" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="415" y="176" font-size="11.5" text-anchor="middle" fill="#5B6470">yes</text>
<g id="return-unchanged"><rect x="470" y="156" width="240" height="56" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="486" y="180" font-size="13" font-weight="600" fill="#1F2328">Return unchanged</text>
<text x="486" y="196" font-size="11.5" fill="#5B6470">Nothing is rewritten</text>
</g>
<text x="262" y="244" font-size="11.5" fill="#5B6470">no</text>
<g id="parse-the-file"><rect x="80" y="256" width="340" height="72" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="280" font-size="13" font-weight="600" fill="#1F2328">Parse the file</text>
<text x="408" y="280" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">parse</text>
<text x="96" y="296" font-size="11.5" fill="#5B6470">PDF, Word, Markdown or text; scanned pages</text>
<text x="96" y="312" font-size="11.5" fill="#5B6470">use optical character recognition</text>
</g>
<path d="M250 228 L250 256" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M420 292.0 L470 292.0" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="reject-with-an-error"><rect x="470" y="260" width="240" height="72" rx="8" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="486" y="284" font-size="13" font-weight="600" fill="#1F2328">Reject with an error</text>
<text x="486" y="300" font-size="11.5" fill="#5B6470">Corrupt, empty or unsupported</text>
<text x="486" y="316" font-size="11.5" fill="#5B6470">file, or over the size limit</text>
</g>
<g id="split-into-chunks"><rect x="80" y="356" width="340" height="72" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="380" font-size="13" font-weight="600" fill="#1F2328">Split into chunks</text>
<text x="408" y="380" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">chunk</text>
<text x="96" y="396" font-size="11.5" fill="#5B6470">By heading and clause; tables keep rows;</text>
<text x="96" y="412" font-size="11.5" fill="#5B6470">cross-references are recorded</text>
</g>
<path d="M250 328 L250 356" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="flag-instruction-like-text"><rect x="80" y="456" width="340" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="480" font-size="13" font-weight="600" fill="#1F2328">Flag instruction-like text</text>
<text x="96" y="496" font-size="11.5" fill="#5B6470">Stored, but never used as evidence</text>
</g>
<path d="M250 428 L250 456" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="extract-rules"><rect x="80" y="540" width="340" height="72" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="564" font-size="13" font-weight="600" fill="#1F2328">Extract rules</text>
<text x="408" y="564" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" fill="#5B6470">lexicon</text>
<text x="96" y="580" font-size="11.5" fill="#5B6470">Parameter lexicon makes rule rows;</text>
<text x="96" y="596" font-size="11.5" fill="#5B6470">curated rows win on the same clause</text>
</g>
<path d="M250 512 L250 540" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="write-vectors-to-chromadb"><rect x="80" y="640" width="340" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="96" y="664" font-size="13" font-weight="600" fill="#1F2328">Write vectors to ChromaDB</text>
<text x="96" y="680" font-size="11.5" fill="#5B6470">Old vectors of the document are deleted first</text>
</g>
<path d="M250 612 L250 640" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M420 668.0 L470 668.0" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="if-vectors-fail"><rect x="470" y="640" width="240" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="486" y="664" font-size="13" font-weight="600" fill="#1F2328">If vectors fail</text>
<text x="486" y="680" font-size="11.5" fill="#5B6470">Status partial; keyword works</text>
</g>
<g id="one-database-transaction"><rect x="80" y="724" width="340" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="96" y="748" font-size="13" font-weight="600" fill="#1F2328">One database transaction</text>
<text x="96" y="764" font-size="11.5" fill="#5B6470">Source Register, chunks, rules, ingestion log</text>
</g>
<path d="M250 696 L250 724" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M420 752.0 L470 752.0" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="if-it-fails"><rect x="470" y="724" width="240" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="486" y="748" font-size="13" font-weight="600" fill="#1F2328">If it fails</text>
<text x="486" y="764" font-size="11.5" fill="#5B6470">New vectors are removed</text>
</g>
<g id="rebuild-the-keyword-index"><rect x="80" y="808" width="340" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="832" font-size="13" font-weight="600" fill="#1F2328">Rebuild the keyword index</text>
<text x="96" y="848" font-size="11.5" fill="#5B6470">In memory, from the database</text>
</g>
<path d="M250 780 L250 808" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="return-the-result"><rect x="80" y="892" width="340" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="96" y="916" font-size="13" font-weight="600" fill="#1F2328">Return the result</text>
<text x="96" y="932" font-size="11.5" fill="#5B6470">doc_id, chunks_indexed, status, warnings</text>
</g>
<path d="M250 864 L250 892" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="24" y="976" width="16" height="12" rx="3" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="46" y="986" font-size="11.5" fill="#5B6470">Step</text>
<rect x="92.61" y="976" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="114.61" y="986" font-size="11.5" fill="#5B6470">Written</text>
<rect x="179.6775" y="976" width="16" height="12" rx="3" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="201.6775" y="986" font-size="11.5" fill="#5B6470">Rejected</text>
<rect x="272.89750000000004" y="976" width="16" height="12" rx="3" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="294.89750000000004" y="986" font-size="11.5" fill="#5B6470">Fallback</text>
</svg>
