<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1026" viewBox="0 0 760 1026" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="1026" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">LangGraph: 11 nodes, 2 conditional edges, one typed state</text>
<g id="start"><rect x="182.0" y="56" width="96" height="32" rx="16.0" fill="#1F2328"/><text x="230" y="76.5" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">START</text></g>
<g id="input-state"><rect x="480" y="56" width="230" height="72" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="496" y="80" font-size="13" font-weight="600" fill="#1F2328">Input state</text>
<text x="496" y="96" font-size="11.5" fill="#5B6470">question, student_id (header),</text>
<text x="496" y="112" font-size="11.5" fill="#5B6470">as_of date, trace_id</text>
</g>
<path d="M278 72 L480 72" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="4 4"/>
<g id="input-guard"><rect x="90" y="112" width="280" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="136" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">input_guard</text>
<text x="106" y="152" font-size="11.5" fill="#5B6470">writes cleaned_question, warnings</text>
</g>
<g id="classify"><rect x="90" y="192" width="280" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="216" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">classify</text>
<text x="106" y="232" font-size="11.5" fill="#5B6470">writes classification (intents, slots)</text>
</g>
<g id="privacy-check"><rect x="90" y="272" width="280" height="56" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="106" y="296" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">privacy_check</text>
<text x="106" y="312" font-size="11.5" fill="#5B6470">writes privacy (allowed, code, reason)</text>
</g>
<g id="plan"><rect x="90" y="352" width="280" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="376" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">plan</text>
<text x="106" y="392" font-size="11.5" fill="#5B6470">writes plan (intent to allowed tools)</text>
</g>
<g id="execute-tools"><rect x="90" y="432" width="280" height="56" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="106" y="456" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">execute_tools</text>
<text x="106" y="472" font-size="11.5" fill="#5B6470">writes findings, tool_calls, plan flags</text>
</g>
<g id="compose"><rect x="90" y="552" width="280" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="576" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">compose</text>
<text x="106" y="592" font-size="11.5" fill="#5B6470">writes answer_type, draft, citations</text>
</g>
<g id="generate"><rect x="90" y="632" width="280" height="56" rx="8" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="106" y="656" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">generate</text>
<text x="106" y="672" font-size="11.5" fill="#5B6470">writes answer, llm_used, validation</text>
</g>
<g id="validate"><rect x="90" y="712" width="280" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="106" y="736" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">validate</text>
<text x="106" y="752" font-size="11.5" fill="#5B6470">writes final answer, validation</text>
</g>
<g id="finalize"><rect x="90" y="792" width="280" height="56" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="106" y="816" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">finalize</text>
<text x="106" y="832" font-size="11.5" fill="#5B6470">writes audit record, returns response</text>
</g>
<g id="refuse"><rect x="480" y="272" width="230" height="56" rx="8" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="496" y="296" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">refuse</text>
<text x="496" y="312" font-size="11.5" fill="#5B6470">writes findings (refusal)</text>
</g>
<g id="document-path"><rect x="480" y="432" width="230" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="496" y="456" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2328">document_path</text>
<text x="496" y="472" font-size="11.5" fill="#5B6470">writes findings, evidence</text>
</g>
<path d="M230 88 L230 112" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 168 L230 192" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 248 L230 272" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 328 L230 352" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 408 L230 432" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 608 L230 632" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 688 L230 712" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 768 L230 792" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M230 328 L230 352" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="242" y="346" font-size="11.5" fill="#5B6470">allowed</text>
<path d="M370 300 L480 300" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="425" y="292" font-size="11.5" text-anchor="middle" fill="#5B6470">denied</text>
<path d="M370 460 L480 460" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="425" y="452" font-size="11.5" text-anchor="middle" fill="#5B6470">needs_documents</text>
<path d="M230 488 L230 552" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="242" y="524" font-size="11.5" fill="#5B6470">otherwise</text>
<path d="M710 300 L730 300 L730 580 L370 580" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M595 488 L595 580" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M230 848 L230 872" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<g id="end"><rect x="182.0" y="872" width="96" height="32" rx="16.0" fill="#1F2328"/><text x="230" y="892.5" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">END</text></g>
<text x="24" y="938" font-size="11.5" fill="#5B6470">The edge after privacy_check tests privacy.allowed. The edge after execute_tools tests needs_documents(state).</text>
<text x="24" y="956" font-size="11.5" fill="#5B6470">Every node appends its name, milliseconds and a summary to node_trace, kept in the audit record.</text>
<rect x="24" y="976" width="16" height="12" rx="3" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="46" y="986" font-size="11.5" fill="#5B6470">Code</text>
<rect x="92.61" y="976" width="16" height="12" rx="3" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="114.61" y="986" font-size="11.5" fill="#5B6470">Branching node</text>
<rect x="222.745" y="976" width="16" height="12" rx="3" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="244.745" y="986" font-size="11.5" fill="#5B6470">Language model</text>
<rect x="352.88" y="976" width="16" height="12" rx="3" fill="#FBE5E2" stroke="#C0392B" stroke-width="1.5"/>
<text x="374.88" y="986" font-size="11.5" fill="#5B6470">Refusal</text>
<rect x="439.9475" y="976" width="16" height="12" rx="3" fill="none" stroke="#9AA3AD" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="461.9475" y="986" font-size="11.5" fill="#5B6470">Optional</text>
<rect x="533.1675" y="976" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="555.1675" y="986" font-size="11.5" fill="#5B6470">Audit write</text>
</svg>
