<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="526" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">Code decides and cites; the language model only rewords</text>
<path d="M130 112 L130 144" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M366 112 L366 144" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M472 172 L528 172" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M528 204 L472 204" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M136 232 L136 264" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 232 L380 264" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M440 232 L440 248 L624 248 L624 264" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M136 352 L136 384" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 352 L380 384" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M624 352 L624 384" fill="none" stroke="#9AA3AD" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="500" y="164" font-size="11.5" text-anchor="middle" fill="#5B6470">draft</text>
<text x="500" y="196" font-size="11.5" text-anchor="middle" fill="#5B6470">checked</text>
<g id="streamlit-app"><rect x="24" y="56" width="212" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="40" y="80" font-size="13" font-weight="600" fill="#1F2328">Streamlit app</text>
<text x="40" y="96" font-size="11.5" fill="#5B6470">Ask, upload, view audit trail</text>
</g>
<g id="fastapi-web-interface"><rect x="260" y="56" width="212" height="56" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="276" y="80" font-size="13" font-weight="600" fill="#1F2328">FastAPI web interface</text>
<text x="276" y="96" font-size="11.5" fill="#5B6470">ask, ingest, audit, sources</text>
</g>
<g id="langgraph-state-machine"><rect x="24" y="144" width="448" height="88" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="40" y="168" font-size="13" font-weight="600" fill="#1F2328">LangGraph state machine</text>
<text x="40" y="184" font-size="11.5" fill="#5B6470">Guard, classify, privacy check, plan, run tools,</text>
<text x="40" y="200" font-size="11.5" fill="#5B6470">compose, validate, audit. Control flow is</text>
<text x="40" y="216" font-size="11.5" fill="#5B6470">written code, never chosen by the model.</text>
</g>
<g id="optional-wording-layer"><rect x="528" y="144" width="208" height="88" rx="8" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="544" y="168" font-size="13" font-weight="600" fill="#1F2328">Optional wording layer</text>
<text x="544" y="184" font-size="11.5" fill="#5B6470">Language model rewords the</text>
<text x="544" y="200" font-size="11.5" fill="#5B6470">draft. A validator checks</text>
<text x="544" y="216" font-size="11.5" fill="#5B6470">every number against facts.</text>
</g>
<g id="retrieval"><rect x="24" y="264" width="224" height="88" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="40" y="288" font-size="13" font-weight="600" fill="#1F2328">Retrieval</text>
<text x="40" y="304" font-size="11.5" fill="#5B6470">Dense vectors plus keyword</text>
<text x="40" y="320" font-size="11.5" fill="#5B6470">search, reranker, and an</text>
<text x="40" y="336" font-size="11.5" fill="#5B6470">evidence gate that abstains</text>
</g>
<g id="source-authority"><rect x="268" y="264" width="224" height="88" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="284" y="288" font-size="13" font-weight="600" fill="#1F2328">Source authority</text>
<text x="284" y="304" font-size="11.5" fill="#5B6470">Applicability, supersession,</text>
<text x="284" y="320" font-size="11.5" fill="#5B6470">authority, recency. Flags</text>
<text x="284" y="336" font-size="11.5" fill="#5B6470">conflicts it cannot resolve.</text>
</g>
<g id="allowlisted-tools"><rect x="512" y="264" width="224" height="88" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="528" y="288" font-size="13" font-weight="600" fill="#1F2328">Allowlisted tools</text>
<text x="528" y="304" font-size="11.5" fill="#5B6470">14 parameterised queries,</text>
<text x="528" y="320" font-size="11.5" fill="#5B6470">no student identifier input,</text>
<text x="528" y="336" font-size="11.5" fill="#5B6470">exact fraction arithmetic.</text>
</g>
<g id="chromadb-and-files"><rect x="24" y="384" width="224" height="72" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="40" y="408" font-size="13" font-weight="600" fill="#1F2328">ChromaDB and files</text>
<text x="40" y="424" font-size="11.5" fill="#5B6470">Chunk vectors and the</text>
<text x="40" y="440" font-size="11.5" fill="#5B6470">original documents</text>
</g>
<g id="sqlite"><rect x="268" y="384" width="468" height="72" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="284" y="408" font-size="13" font-weight="600" fill="#1F2328">SQLite</text>
<text x="284" y="424" font-size="11.5" fill="#5B6470">Students, attendance, results, rule registry,</text>
<text x="284" y="440" font-size="11.5" fill="#5B6470">Source Register, chunks, audit records</text>
</g>
<rect x="24" y="476" width="16" height="12" rx="3" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="46" y="486" font-size="11.5" fill="#5B6470">Control</text>
<rect x="111.0675" y="476" width="16" height="12" rx="3" fill="#FCEFD9" stroke="#C26A00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="133.0675" y="486" font-size="11.5" fill="#5B6470">Language model (not a source of truth)</text>
<rect x="388.8625" y="476" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="410.8625" y="486" font-size="11.5" fill="#5B6470">Data store</text>
</svg>
