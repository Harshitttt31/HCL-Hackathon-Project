<svg xmlns="http://www.w3.org/2000/svg" width="760" height="702" viewBox="0 0 760 702" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AD"/></marker></defs>
<rect width="760" height="702" fill="#FFFFFF"/>
<text id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1F2328">Ten tables: personal records, documents and rules, and operations logs</text>
<g id="attendance"><rect x="268" y="56" width="224" height="104" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="284" y="80" font-size="13" font-weight="600" fill="#1F2328">attendance</text>
<text x="284" y="96" font-size="11.5" fill="#5B6470">student_id, course_code (key)</text>
<text x="284" y="112" font-size="11.5" fill="#5B6470">classes_held, classes_attended</text>
<text x="284" y="128" font-size="11.5" fill="#5B6470">Percentage is computed,</text>
<text x="284" y="144" font-size="11.5" fill="#5B6470">never stored</text>
</g>
<g id="results"><rect x="268" y="200" width="224" height="104" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="284" y="224" font-size="13" font-weight="600" fill="#1F2328">results</text>
<text x="284" y="240" font-size="11.5" fill="#5B6470">student_id, course_code,</text>
<text x="284" y="256" font-size="11.5" fill="#5B6470">exam_session, exam_type (key)</text>
<text x="284" y="272" font-size="11.5" fill="#5B6470">marks, result: PASS, FAIL,</text>
<text x="284" y="288" font-size="11.5" fill="#5B6470">ABSENT or DETAINED</text>
</g>
<g id="students"><rect x="24" y="100" width="224" height="104" rx="8" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="2"/>
<text x="40" y="124" font-size="13" font-weight="600" fill="#1F2328">students</text>
<text x="40" y="140" font-size="11.5" fill="#5B6470">student_id, full_name,</text>
<text x="40" y="156" font-size="11.5" fill="#5B6470">programme, batch_year,</text>
<text x="40" y="172" font-size="11.5" fill="#5B6470">current_semester, cgpa,</text>
<text x="40" y="188" font-size="11.5" fill="#5B6470">active_backlogs</text>
</g>
<g id="courses"><rect x="512" y="128" width="224" height="72" rx="8" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="528" y="152" font-size="13" font-weight="600" fill="#1F2328">courses</text>
<text x="528" y="168" font-size="11.5" fill="#5B6470">course_code, course_name,</text>
<text x="528" y="184" font-size="11.5" fill="#5B6470">programme, semester, credits</text>
</g>
<path d="M258 108.0 L258 252.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M248 152.0 L258 152.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M258 108.0 L268 108.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M258 252.0 L268 252.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M502 108.0 L502 252.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M512 164.0 L502 164.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M502 108.0 L492 108.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M502 252.0 L492 252.0" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<text x="24" y="230" font-size="11.5" fill="#5B6470">One student has many attendance and</text>
<text x="24" y="246" font-size="11.5" fill="#5B6470">result rows; so does one course.</text>
<g id="source-register"><rect x="268" y="352" width="224" height="120" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="284" y="376" font-size="13" font-weight="600" fill="#1F2328">source_register</text>
<text x="284" y="392" font-size="11.5" fill="#5B6470">doc_id (key), title, issuer,</text>
<text x="284" y="408" font-size="11.5" fill="#5B6470">authority_level (1 to 5),</text>
<text x="284" y="424" font-size="11.5" fill="#5B6470">doc_type, version, supersedes,</text>
<text x="284" y="440" font-size="11.5" fill="#5B6470">effective_from, effective_to,</text>
<text x="284" y="456" font-size="11.5" fill="#5B6470">scope_programmes, scope_batches</text>
</g>
<g id="rule-registry"><rect x="24" y="352" width="224" height="120" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="40" y="376" font-size="13" font-weight="600" fill="#1F2328">rule_registry</text>
<text x="40" y="392" font-size="11.5" fill="#5B6470">rule_id (key), parameter,</text>
<text x="40" y="408" font-size="11.5" fill="#5B6470">operator, value, unit,</text>
<text x="40" y="424" font-size="11.5" fill="#5B6470">scope, effective dates,</text>
<text x="40" y="440" font-size="11.5" fill="#5B6470">source_doc_id, source_section,</text>
<text x="40" y="456" font-size="11.5" fill="#5B6470">origin: curated or extracted</text>
</g>
<g id="chunks"><rect x="512" y="352" width="224" height="120" rx="8" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="528" y="376" font-size="13" font-weight="600" fill="#1F2328">chunks</text>
<text x="528" y="392" font-size="11.5" fill="#5B6470">chunk_id (key), doc_id,</text>
<text x="528" y="408" font-size="11.5" fill="#5B6470">section_number, section_title,</text>
<text x="528" y="424" font-size="11.5" fill="#5B6470">kind: paragraph, list, table,</text>
<text x="528" y="440" font-size="11.5" fill="#5B6470">text, page, references,</text>
<text x="528" y="456" font-size="11.5" fill="#5B6470">injection_suspected</text>
</g>
<path d="M268 412 L248 412" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<path d="M492 412 L512 412" fill="none" stroke="#9AA3AD" stroke-width="1.25"/>
<g id="audit-log"><rect x="24" y="504" width="224" height="104" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="40" y="528" font-size="13" font-weight="600" fill="#1F2328">audit_log</text>
<text x="40" y="544" font-size="11.5" fill="#5B6470">trace_id (key), timestamp,</text>
<text x="40" y="560" font-size="11.5" fill="#5B6470">student_id_hash,</text>
<text x="40" y="576" font-size="11.5" fill="#5B6470">question_hash, answer_type,</text>
<text x="40" y="592" font-size="11.5" fill="#5B6470">latency_ms, record_json</text>
</g>
<g id="ingestion-log"><rect x="268" y="504" width="224" height="72" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="284" y="528" font-size="13" font-weight="600" fill="#1F2328">ingestion_log</text>
<text x="284" y="544" font-size="11.5" fill="#5B6470">id, timestamp, doc_id,</text>
<text x="284" y="560" font-size="11.5" fill="#5B6470">status, chunks, details</text>
</g>
<g id="embedding-cache"><rect x="512" y="504" width="224" height="72" rx="8" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="528" y="528" font-size="13" font-weight="600" fill="#1F2328">embedding_cache</text>
<text x="528" y="544" font-size="11.5" fill="#5B6470">model, text_hash (key),</text>
<text x="528" y="560" font-size="11.5" fill="#5B6470">vector</text>
</g>
<text x="268" y="600" font-size="11.5" fill="#5B6470">audit_log has no link to students:</text>
<text x="268" y="616" font-size="11.5" fill="#5B6470">only a keyed hash of the identifier.</text>
<rect x="24" y="652" width="16" height="12" rx="3" fill="#E6EEFB" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="46" y="662" font-size="11.5" fill="#5B6470">Personal records (private)</text>
<rect x="227.965" y="652" width="16" height="12" rx="3" fill="#E3F4EC" stroke="#1F8A5B" stroke-width="1.5"/>
<text x="249.965" y="662" font-size="11.5" fill="#5B6470">Documents and rules</text>
<rect x="388.8625" y="652" width="16" height="12" rx="3" fill="#F5F6F8" stroke="#C9CED4" stroke-width="1"/>
<text x="410.8625" y="662" font-size="11.5" fill="#5B6470">Operations</text>
</svg>
